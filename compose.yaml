services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: triage_desk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-triage-desk
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d triage_desk"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - local-postgres:/var/lib/postgresql

volumes:
  local-postgres:
